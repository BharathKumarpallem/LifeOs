version: '3.8'

services:
  lifeos-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  lifeos-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://lifeos_admin:lifeos_secure_password@lifeos-postgres:5432/lifeos_db
    depends_on:
      - lifeos-postgres
    restart: unless-stopped

  # Optional local PostgreSQL database if not using managed Supabase
  lifeos-postgres:
    image: postgres:15-alpine
    container_name: lifeos_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lifeos_admin
      POSTGRES_PASSWORD: lifeos_secure_password
      POSTGRES_DB: lifeos_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pgdata:
